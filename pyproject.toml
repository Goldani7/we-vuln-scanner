[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-vuln-scanner"
dynamic = ["version"]
description = "Passive web and email/DNS vulnerability scanner, with SARIF output and EPSS/KEV prioritization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
    "rich>=13.7.0",
    "dnspython>=2.4.0",
    "httpx[socks]>=0.27.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "slowapi>=0.1.9"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "fastapi>=0.110.0", "uvicorn>=0.27.0", "slowapi>=0.1.9"]

[project.scripts]
wvs = "scanner.cli:main"
goldani = "scanner.menu:main"
web-vuln-scanner = "scanner.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scanner.__version__" }

[tool.setuptools.packages.find]
include = ["scanner*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "E501"]  # keep typing.List/Optional style used in api/

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731", "E402"]

[tool.coverage.run]
source = ["scanner", "api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
