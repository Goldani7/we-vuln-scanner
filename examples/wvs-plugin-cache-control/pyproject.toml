[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wvs-plugin-cache-control"
version = "0.1.0"
description = "Exemplo de plugin do web-vuln-scanner: respostas com cookies sem Cache-Control adequado"
requires-python = ">=3.10"
dependencies = ["web-vuln-scanner"]

# The "wvs.checks" group is how the scanner discovers plugins. The value points to a CheckSpec.
[project.entry-points."wvs.checks"]
cache_control = "wvs_cache_control:SPEC"

[tool.setuptools]
packages = ["wvs_cache_control"]
