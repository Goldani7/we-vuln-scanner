name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run a smoke test
        run: |
          docker build -t wvs .
          docker run --rm wvs --list-checks | grep -q open_redirect

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: "Test (offline - all HTTP is mocked)"
        run: python -m pytest tests -q --cov --cov-fail-under=85

  plugin-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner and the example plugin
        run: python -m pip install -e ".[dev]" -e examples/wvs-plugin-cache-control
      - name: Plugin is discovered through the wvs.checks entry point
        run: wvs --list-checks | grep -q "plugin:cache_control"
      - name: Tests with the plugin installed
        run: python -m pytest tests -q
